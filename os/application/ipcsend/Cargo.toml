[package]
edition = "2024"
name = "ipcsend"
version = "0.1.0"
authors = ["Richard Schweitzer <risch114@uni-duesseldorf.de>"]

[lib]
crate-type = ["staticlib"]
path = "src/ipcsend.rs"
test = false
doctest = false
bench = false

[dependencies]
# Local dependencies
d3os = { path = "../../library/d3os" }
runtime = { path = "../../library/runtime" }
terminal = { path = "../../library/terminal" }
concurrent = { path = "../../library/concurrent" }
ipc = { path = "../../library/ipc" }
syscall = { path = "../../library/syscall" }
logger = { path = "../../library/logger" }

# external dependencies
log = "0.4.26"


uuid = { version = "1.23.1", default-features = false, features = ["v7"] }